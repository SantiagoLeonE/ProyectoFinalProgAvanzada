<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon">🎓</div>
      <h1>Crear cuenta</h1>
      <p>Universidad del Quindío</p>
    </div>

    <div class="form-group">
      <label>Identificación</label>
      <input type="text" [(ngModel)]="identificacion" placeholder="Número de identificación"/>
    </div>

    <div class="form-group">
      <label>Nombre completo</label>
      <input type="text" [(ngModel)]="nombre" placeholder="Tu nombre completo"/>
    </div>

    <div class="form-group">
      <label>Correo electrónico</label>
      <input type="email" [(ngModel)]="email" placeholder="correo@uniquindio.edu.co"/>
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" [(ngModel)]="contrasena" placeholder="••••••••"/>
    </div>

    <div class="form-group">
      <label>Rol</label>
      <select [(ngModel)]="rol">
        <option value="ESTUDIANTE">Estudiante</option>
        <option value="DOCENTE">Docente</option>
        <option value="ADMINISTRATIVO">Administrativo</option>
      </select>
    </div>

    <div class="error-msg" *ngIf="error">{{ error }}</div>

    <button class="btn-primary" (click)="registro()" [disabled]="cargando">
      {{ cargando ? 'Registrando...' : 'Crear cuenta' }}
    </button>

    <p class="registro-link">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
