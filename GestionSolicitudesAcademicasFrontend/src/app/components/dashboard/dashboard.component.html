<div class="dashboard-container">
  <nav class="navbar">
    <div class="navbar-brand">
      <span class="logo-icon">🎓</span>
      <span>Gestión Académica</span>
    </div>
    <div class="navbar-user">
      <span class="user-badge" [class]="'badge-' + usuario?.rol?.toLowerCase()">
        {{ usuario?.rol?.replace('ROLE_', '') }}
      </span>
      <span class="user-name">{{ usuario?.nombre }}</span>
      <button class="btn-logout" (click)="logout()">Cerrar sesión</button>
    </div>
  </nav>

  <div class="dashboard-content">
    <aside class="sidebar">
      <ul class="menu-list">
        <li>
          <a routerLink="/solicitudes" routerLinkActive="active">
            📋 Solicitudes
          </a>
        </li>
        <li *ngIf="esEstudiante">
          <a routerLink="/solicitudes/nueva" routerLinkActive="active">
            ➕ Nueva Solicitud
          </a>
        </li>
        <li *ngIf="esAdmin">
          <a routerLink="/usuarios" routerLinkActive="active">
            👥 Usuarios
          </a>
        </li>
      </ul>
    </aside>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
